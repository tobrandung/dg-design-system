# Veröffentlichen: main → Build → GitHub Pages
#
# Läuft, sobald ein geprüfter Pull Request auf main gemergt ist. Token-PRs öffnet das
# Figma-Plugin „DG Tokens“, geprüft werden sie von .github/workflows/tokens-pr.yml.
name: Veröffentlichen

on:
  push:
    branches: [main]
    paths: ["tokens/**", "src/**", "public/**", "*.html", "scripts/**", "package*.json", "vite.config.mjs"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
