# Tokens → Build → GitHub Pages
#
# Läuft bei jedem Push auf main, der Tokens oder Code ändert. Den Token-Commit schreibt das
# Figma-Plugin „DG Tokens“ (Befehl „Tokens senden“) nach dem Publish in Figma.
name: Tokens

on:
  push:
    branches: [main]
    paths: ["tokens/**", "src/**", "index.html", "scripts/**", "package*.json", "vite.config.mjs"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
