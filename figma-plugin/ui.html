<style>
  :root { font: 12px/16px Inter, system-ui, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
  body { margin: 0; padding: 16px; display: grid; gap: 16px; }
  h1 { font-size: 13px; line-height: 20px; margin: 0; font-weight: 600; }
  p { margin: 0; color: var(--figma-color-text-secondary); }
  fieldset { border: 1px solid var(--figma-color-border); border-radius: 6px; padding: 12px; display: grid; gap: 8px; margin: 0; }
  legend { padding: 0 4px; font-weight: 600; }
  label { display: grid; gap: 4px; }
  label.check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  input[type=text], input[type=password], input[type=url] { font: inherit; padding: 6px 8px; border: 1px solid var(--figma-color-border); border-radius: 4px; background: var(--figma-color-bg); color: var(--figma-color-text); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--figma-color-border); background: var(--figma-color-bg); color: var(--figma-color-text); cursor: pointer; }
  button.primary { background: var(--figma-color-bg-brand); color: var(--figma-color-text-onbrand); border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  ul { margin: 0; padding-left: 16px; color: var(--figma-color-text-secondary); }
  .status { padding: 8px 10px; border-radius: 6px; background: var(--figma-color-bg-secondary); white-space: pre-line; }
  .status.error { background: var(--figma-color-bg-danger-tertiary); color: var(--figma-color-text-danger); }
</style>

<h1>DG Tokens</h1>
<p>Nach dem Publish in Figma rechts im Eigenschaften-Panel auf „Tokens senden“ klicken (oder Plugins → DG Tokens → Tokens senden). Hier richtest du die Ziele einmalig ein.</p>

<fieldset>
  <legend>Ziele</legend>
  <label class="check"><input type="checkbox" id="use-local"> Lokaler Dev-Server (Live-Vorschau)</label>
  <label>Adresse<input type="url" id="local" placeholder="http://localhost:4318"></label>
  <label class="check"><input type="checkbox" id="use-github"> GitHub (baut und veröffentlicht die Seite)</label>
  <label>Repository (owner/name)<input type="text" id="repo" placeholder="brandung/dg-design-system"></label>
  <label>Branch<input type="text" id="branch" placeholder="main"></label>
  <label>Token (fine-grained, nur dieses Repo, Contents: Read and write)<input type="password" id="token" autocomplete="off"></label>
  <div class="row"><button class="primary" id="save">Speichern</button><button id="sync">Jetzt senden</button></div>
</fieldset>

<fieldset>
  <legend>Vorschau und Download</legend>
  <div class="row"><button id="export">Tokens lesen</button><button id="download" disabled>JSON herunterladen</button></div>
  <ul id="list"></ul>
</fieldset>

<div class="status" id="status" hidden></div>

<script>
  const $ = (id) => document.getElementById(id);
  const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');
  const status = (text, error) => { const s = $('status'); s.hidden = false; s.textContent = text; s.className = 'status' + (error ? ' error' : ''); };
  let files = null;
  let sendAfterExport = false; // „Jetzt senden“: Export-Antwort direkt weiterschicken

  const readForm = () => ({
    local: $('use-local').checked ? ($('local').value.trim() || 'http://localhost:4318') : '',
    github: $('use-github').checked ? { repo: $('repo').value.trim(), branch: $('branch').value.trim() || 'main', token: $('token').value.trim() } : null
  });
  const fillForm = (s) => {
    $('use-local').checked = !!s.local; $('local').value = s.local || 'http://localhost:4318';
    $('use-github').checked = !!s.github; $('repo').value = s.github?.repo || ''; $('branch').value = s.github?.branch || 'main'; $('token').value = s.github?.token || '';
  };

  async function gh(path, token, init = {}) {
    const res = await fetch('https://api.github.com' + path, { ...init, headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(init.body ? { 'Content-Type': 'application/json' } : {}) } });
    if (!res.ok) throw new Error(`GitHub ${res.status}: ${(await res.json().catch(() => ({}))).message || res.statusText}`);
    return res.json();
  }
  async function pushGithub({ repo, branch, token }, files, fileName) {
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) throw new Error('GitHub: Repository (owner/name) und Token fehlen.');
    const ref = await gh(`/repos/${repo}/git/ref/heads/${branch}`, token);
    const parentCommit = await gh(`/repos/${repo}/git/commits/${ref.object.sha}`, token);
    const tree = await gh(`/repos/${repo}/git/trees`, token, { method: 'POST', body: JSON.stringify({ base_tree: parentCommit.tree.sha, tree: Object.entries(files).map(([path, content]) => ({ path, mode: '100644', type: 'blob', content })) }) });
    if (tree.sha === parentCommit.tree.sha) return 'GitHub: keine Änderungen';
    const commit = await gh(`/repos/${repo}/git/commits`, token, { method: 'POST', body: JSON.stringify({ message: `chore(tokens): Sync aus Figma (${fileName})`, tree: tree.sha, parents: [ref.object.sha] }) });
    await gh(`/repos/${repo}/git/refs/heads/${branch}`, token, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) });
    return `GitHub: Commit ${commit.sha.slice(0, 7)} auf ${branch}`;
  }
  async function pushLocal(url, files) {
    let res;
    try { res = await fetch(url.replace(/\/$/, '') + '/__dg-tokens', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ files }) }); } // text/plain: keine CORS-Vorabanfrage nötig
    catch { throw new Error(`Dev-Server unter ${url} nicht erreichbar. Läuft npm run dev?`); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok || !json.ok) throw new Error(`Dev-Server: ${json.error || res.status}`);
    return json.changed.length ? `Dev-Server: ${json.changed.length} Datei(en) aktualisiert` : 'Dev-Server: keine Änderungen';
  }
  async function send(settings, data) {
    if (data.conflicts?.length) throw new Error('Doppelte Token-Pfade in Figma: ' + data.conflicts.join(', '));
    const results = [], errors = [];
    if (settings.local) await pushLocal(settings.local, data.files).then((r) => results.push(r), (e) => errors.push(e.message));
    if (settings.github) await pushGithub(settings.github, data.files, data.fileName).then((r) => results.push(r), (e) => errors.push(e.message));
    return { text: [...results, ...errors].join('\n'), error: errors.length > 0 };
  }

  onmessage = async (e) => {
    const m = e.data.pluginMessage;
    if (!m) return;
    if (m.type === 'settings') fillForm(m.value);
    if (m.type === 'sync') {
      try { const r = await send(m.settings, m); post({ type: 'done', text: 'DG Tokens · ' + r.text.replaceAll('\n', ' · '), error: r.error }); }
      catch (err) { post({ type: 'done', text: 'DG Tokens: ' + err.message, error: true }); }
    }
    if (m.type === 'files') {
      files = m.files;
      $('list').innerHTML = Object.entries(files).map(([p, c]) => `<li>${p} <small>(${(c.length / 1024).toFixed(1)} KB)</small></li>`).join('');
      $('download').disabled = false;
      if (sendAfterExport) {
        sendAfterExport = false;
        try { const r = await send(readForm(), m); status(r.text, r.error); } catch (err) { status(err.message, true); }
      } else {
        status(`${m.counts.variables} Variablen, ${m.counts.textStyles} Textstile, ${m.counts.effectStyles} Effektstile gelesen.` + (m.conflicts.length ? `\nAchtung, doppelte Pfade: ${m.conflicts.join(', ')}` : ''), m.conflicts.length > 0);
      }
    }
    if (m.type === 'error') status(m.message, true);
  };

  $('save').onclick = () => { post({ type: 'settings:set', value: readForm() }); status('Gespeichert. „Tokens senden“ nutzt ab jetzt diese Ziele.'); };
  $('export').onclick = () => { status('Lese Tokens …'); post({ type: 'export' }); };
  $('sync').onclick = () => { post({ type: 'settings:set', value: readForm() }); status('Lese und sende …'); sendAfterExport = true; post({ type: 'export' }); };
  $('download').onclick = () => {
    for (const [p, c] of Object.entries(files)) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([c], { type: 'application/json' }));
      a.download = p.split('/').pop();
      a.click();
    }
  };
  post({ type: 'ready' });
</script>
